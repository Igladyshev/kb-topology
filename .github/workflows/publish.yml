name: Publish

# Publishes to PyPI when a tag like v0.1.0 is pushed. The tag must match [project] version.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in GitHub.
# One-time setup on pypi.org: Account > Publishing > add a pending publisher with
#   project kb-topology, owner Igladyshev, repository kb-topology,
#   workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches package version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
